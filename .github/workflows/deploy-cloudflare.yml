name: Deploy to Cloudflare Pages

on:
  push:
    branches: [built-output]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout built files
        uses: actions/checkout@v4
        with:
          ref: built-output

      - name: Deploy
        env:
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          echo Test deployment
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify"             -H "X-Auth-Email: $CF_EMAIL"             -H "X-Auth-Key: $CF_API_KEY"
          echo done.
