name: Deploy to Cloudflare Pages

on:
  push:
    branches: [built-output]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          echo "Deploying to Cloudflare Pages..."
          curl -sf "https://api.cloudflare.com/client/v4/user/tokens/verify"             -H "X-Auth-Email: $CF_EMAIL"             -H "X-Auth-Key: $CF_API_KEY"             | python3 -c "import json,sys;d=json.load(sys.stdin);print('Auth OK, user:', d['result']['id'])" || echo "Auth failed"
          echo "DONE"
