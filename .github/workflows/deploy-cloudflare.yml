name: Deploy to Cloudflare Pages

on:
  push:
    branches: [built-output]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout built files
        uses: actions/checkout@v4
        with:
          ref: built-output

      - name: Deploy via Cloudflare API
        env:
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_ACCOUNT_ID: fe3fd711e0dc7e7de5adcde70133fda1
        run: |
          set -e
          echo "Deploying to Cloudflare Pages..."
          
          RESP=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/kvideo/deployments" \
            -H "X-Auth-Email: $CF_EMAIL" \
            -H "X-Auth-Key: $CF_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main"}')
          
          echo "$RESP" | python3 -c "
          import json,sys
          r=json.load(sys.stdin)
          if r.get('success'):
              dep=r['result']
              print(f\"✅ 部署成功: {dep['id'][:12]}\")
              print(f\"   URL: https://kvideo.pages.dev\")
          else:
              print(f\"❌: {r.get('errors')}\")
              sys.exit(1)
          "
